<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The browser-tab icon. This is the identity's app-icon lockup: the mark on a
    filled navy tile rather than the bare mark on transparency.

    The tile is not decoration. A favicon is rendered at 16px against whatever
    colour the browser's tab strip happens to be — light, dark, or a photo, in
    the case of a themed browser — and a transparent mark loses its silhouette
    against half of those. A filled tile is the same shape on all of them.

    The sparkle keeps its white fill here, unlike in components/Logo.tsx: every
    surface behind it on this icon is dark, so the two-colour problem the
    component solves does not exist.
  -->
  <defs>
    <linearGradient id="g" x1="19" y1="15" x2="49" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A1F44"/>
  <rect x="11" y="24" width="26" height="30" rx="9" fill="#7C3AED" opacity="0.5"/>
  <rect x="19" y="15" width="30" height="32" rx="10" fill="url(#g)"/>
  <path d="M26 24h16M34 24v16" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round"/>
  <path d="M52 8c.9 4.35 1.65 5.1 6 6-4.35.9-5.1 1.65-6 6-.9-4.35-1.65-5.1-6-6 4.35-.9 5.1-1.65 6-6Z" fill="#FFFFFF"/>
</svg>
